<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <meta name="description" content="...">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="home">
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <span class="brand-mark"><img src="" alt="..."></span>
          <span class="brand-text">
            <strong>...</strong>
            <small data-i18n="brandSubtitle"></small>
          </span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button class="lang-toggle active" type="button" data-lang="vi">VI</button>
          <button class="lang-toggle" type="button" data-lang="en">EN</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <div class="container-fluid px-0">
        <div class="hero-slider" id="heroSlider">
          <div class="hero-track" id="heroTrack"></div>
          <button class="hero-arrow hero-arrow-left" id="prevSlide" type="button" aria-label="Previous slide">‹</button>
          <button class="hero-arrow hero-arrow-right" id="nextSlide" type="button" aria-label="Next slide">›</button>
          <div class="hero-dots" id="heroDots"></div>
        </div>
      </div>
    </section>

    <section class="intro-section section-space">
      <div class="container">
        <div class="home-intro text-center mx-auto">
          <h1 data-i18n="aboutTitle"></h1>
          <p data-i18n="aboutDescription"></p>
          <span><i class="fa-solid fa-landmark" style="color:#8f1d14"></i></span>
        </div>
      </div>
    </section>

    <section class="places-section section-space pt-0">
      <div class="container">
        <div class="toolbar-card">
          <div class="row g-3 align-items-center">
            <div class="col-12">
              <label class="visually-hidden" for="searchInput">Search</label>
              <div class="search-box">
                <span><i class="fa-solid fa-magnifying-glass" style="color: #8f1d14;"></i></span>
                <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Tìm kiếm địa điểm, từ khóa...">
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4 mt-2" id="placesGrid"></div>
        <div class="pagination-wrap" id="pagination"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-contact">
        <span class="footer-heading" data-i18n="footerInfoTitle"></span>
        <p data-i18n="footerEmail"></p>
        <p data-i18n="footerPhone"></p>
      </div>
      <p class="footer-bottom" data-i18n="footerCopyright"></p>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
